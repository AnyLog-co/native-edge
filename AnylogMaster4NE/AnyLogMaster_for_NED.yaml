tosca_definitions_version: nativeedge_1_1
description: >
  Deploys VM with Anylog Master Node

imports:
  - nativeedge/types/types.yaml
  - Infrastructure/inputs_common.yaml
  - Infrastructure/inputs.yaml
  - Infrastructure/vm.yaml
  - Infrastructure/outputs.yaml
  - Application/inputs_common.yaml
  - Application/inputs.yaml
  - Application/application.yaml
  - Application/outputs.yaml


input_groups:
  app:
    display_label: AnyLog Master
    collapsible: true
    index: 0
    inputs:
      - node_name_prefix
      - node_type
      - company_name
      - nic_type
      - ledger_conn
      - anylog_license_secret_name
      - environment_type
      - docker_credentials_secret_name
  ned:
    display_label: Anylog Master Node VM
    collapsible: true
    index: 1
    inputs:
      - deployment_id
      - vm_user_name
      - os_type
      - vcpus
      - memory_size
      - os_disk_size
      - disk
      - segment_name
      - ssh_user_private_key_secret_name
      - ssh_user_public_key_secret_name
  dhcp:
    display_label: Network Interfaces Configuration
    collapsible: true
    index: 2
    inputs:
      - dhcp
      - static_ip
      - gateway
      - dns

labels:
  csys-obj-type:
    values:
      - environment
  target_environment:
    values:
      - ned
  vendor:
    values:
      - AnyLog
  solution:
    values:
      - Master

blueprint_labels:
  env:
    values:
      - NED
